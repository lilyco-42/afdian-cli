[package]
name = "afdian-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "爱发电 CLI · 用 tiny_lilyco 框架一键对接爱发电开放接口"
repository = "https://github.com/lilyco-42/afdian-cli"
homepage = "https://github.com/lilyco-42/afdian-cli"
keywords = ["afdian", "cli", "payments", "lilyco", "mcp"]
categories = ["command-line-utilities"]
readme = "README.md"

[workspace]

[features]
default = ["net"]
net = ["dep:ureq", "dep:serde_json"]

[dependencies]
# tiny_lilyco 是 lilyco 仓库的子 crate（自带独立 [workspace]）。
# 用 git 依赖时 cargo 会去仓库根找 Cargo.toml，因此必须显式指向子目录。
tiny_lilyco = { git = "https://github.com/lilyco-42/lilyco", branch = "main" }
serde_json = { version = "1", optional = true }
ureq = { version = "2", optional = true, features = ["json"] }

[dev-dependencies]
serde_json = "1"

[[bin]]
name = "afdian"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
